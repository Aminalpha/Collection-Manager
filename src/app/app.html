<header id="collection-header">
  <h1>{{selectedCollection()?.title}}</h1>
  <div>
    <app-search-bar 

      [(search)]="search"
    >
    </app-search-bar>

  </div>
  
</header>


<section class="collection-grid">
  @for (item of collectionItem(); track item.name) {
    
    @switch (item.rarity) {
      @case ("Legendary") {
        <div>
          <app-collection-item-card [item]="item"></app-collection-item-card>
          <hr class="gold">
        </div>
      }
      @case ("Rare") {
        <div>
          <app-collection-item-card [item]="item"></app-collection-item-card>
          <hr class="rare">
        </div> 
      }
      @default {
        <app-collection-item-card [item]="item"></app-collection-item-card>
      }
    }
  }

 </section>

 @let itemsCount = collectionItem()?.length;

 @if (itemsCount) {
  <div class="centered"> Found {{itemsCount}} results</div>
 }@else {
  <div class="centered"> No items found</div>
 }
